ter;gap:6px}.toggle{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#0c1729;color:#c8d4e6;font-size:12px}.notice{padding:12px 14px;border-radius:13px;border:1px solid #5a4d2c;background:rgba(255,209,102,.07);color:#e8d9a8;font-size:12px;line-height:1.5}.kbd{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#0a1424;border:1px solid #263a57;border-radius:6px;padding:2px 5px;font-size:11px}@media(max-width:720px){.wrap{padding:10px}.card{padding:15px;border-radius:17px}.hero{padding:22px 17px}.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.home-stats{grid-template-columns:1fr}.top{align-items:flex-start}.brand{font-size:18px}.q{font-size:21px}.answer{padding:14px}.meta select{width:100%;margin-left:0}.result{grid-template-columns:1fr 1fr}.actions .btn{flex:1;min-width:120px}.timer{font-size:19px}}
</style></head><body><div class="wrap"><header class="top"><div class="brand">⚡ ANRE Grad I Trainer<small>FINAL · 414 întrebări utilizabile · 3 materii</small></div><span class="pill" id="count"></span></header><nav class="tabs"><button class="tab active" data-mode="home">🏠 Acasă</button><button class="tab" data-mode="learn">📚 Învățare</button><button class="tab" data-mode="mistakes">🔥 Greșelile mele</button><button class="tab" data-mode="quick">⚡ Test rapid</button><button class="tab" data-mode="exam">📝 Examen</button><button class="tab" data-mode="stats">📊 Statistici</button></nav><main id="app"></main><div class="footer">Baza folosită: materialele ANRE încărcate în proiect. 414 întrebări au răspuns verificat în baza auditată; 11 întrebări care necesită diagramă/revizuire sunt excluse. „Verificat tehnic” nu înseamnă barem oficial ANRE.</div></div><script>
const DATA=[{"ID":"G1-ELE-001","Categorie":"Electrotehnică","Sursa":"ELECTROTEHNICA-09.2024-2.xlsx","Versiune":"09.2024","Rand_sursa":8,"Intrebare":"Atunci când se compensează energia electrica reactiva prin baterii de condensatoare, tensiunea în reţeaua electrica:","A":"scade","B":"nu se modifica","C":"creste","Raspuns":"C","Status":"VERIFICAT TEHNIC","Baza_verificare":"Calcul/principiu electrotehnic + coroborare web","Explicatie":"Răspuns verificat tehnic; nu este prezentat ca barem oficial ANRE.","detail":{"why":"Compensarea capacitivă furnizează local putere reactivă, reducând curentul reactiv transportat prin rețea și, implicit, căderea de tensiune.","opts":{"A":"Greșit: reducerea curentului reactiv nu produce o scădere a tensiunii receptorului în acest context.","B":"Greșit: compensarea modifică regimul reactiv și influențează căderea de tensiune.","C":"Corect: Q↓ → I reactiv↓ → cădere de tensiune↓ → U↑."},"remember":"Compensare cu condensatoare → Q ↓ → I reactiv ↓ → ΔU ↓ → U ↑"}},{"ID":"G1-ELE-002","Categorie":"Electrotehnică","Sursa":"ELECTROTEHNICA-09.2024-2.xlsx","Versiune":"09.2024","Rand_sursa":9,"Intrebare":"Bobinele de stingere din staţiile electrice de transformare sunt echipamente pentru:","A":"compensarea factorului de putere","B":"dotări PSI","C":"compensarea curenţilor capacitivi","Raspuns":"C","Status":"VERIFICAT TEHNIC","Baza_verificare":"Calcul/principiu electrotehnic + coroborare web","Explicatie":"Răspuns verificat tehnic; nu este prezentat ca barem oficial ANRE.","detail":{"why":"Bobina de stingere (bobina Petersen) compensează curentul capacitiv de defect la pământ, limitând curentul rezidual.","opts":{"A":"Greșit: aceasta nu este funcția principală a bobinei de stingere.","B":"Greșit: PSI ține de protecția împotriva incendiilor, nu de compensarea curenților capacitivi.","C":"Corect: bobina compensează componenta capacitivă a curentului de defect la pământ."},"remember":"Bobina Petersen → curent capacitiv de defect ↓"}},{"ID":"G1-ELE-003","Categorie":"Electrotehnică","Sursa":"ELECTROTEHNICA-09.2024-2.xlsx","Versiune":"09.2024","Rand_sursa":10,"Intrebare":"Câmpul magnetic poate fi produs:","A":"numai de magneţi permanenţi","B":"numai de electromagneţi","C":"de magneţi permanenţi si de electromagneţi","Raspuns":"C","Status":"VERIFICAT TEHNIC","Baza_verificare":"Calcul/principiu electrotehnic + coroborare web","Explicatie":"Răspuns verificat tehnic; nu este prezentat ca barem oficial ANRE.","detail":{"why":"Câmpul magnetic poate exista atât în jurul magneților permanenți, cât și în jurul electromagneților.","opts":{"A":"Greșit: electromagneții produc și ei câmp magnetic.","B":"Greșit: și magneții permanenți produc câmp magnetic.","C":"Corect: ambele tipuri produc câmp magnetic."},"remember":"Magnet permanent + electromagnet → câmp magnetic"}},{"ID":"G1-ELE-004","Categorie":"Electrotehnică","Sursa":"ELECTROTEHNICA-09.2024-2.xlsx","Versiune":"09.2024","Rand_sursa":11,"Intrebare":"3 condensatoare având capacitatea C1=100 μF, C2=50 μF, C3=100 μF legate în paralel, au capacitatea echivalentă.","A":"25 μF","B":"250 μF","C":"50 μF","Raspuns":"B","Status":"VERIFICAT TEHNIC","Baza_verificare":"Calcul/principiu electrotehnic + coroborare web","Explicatie":"Răspuns verificat tehnic; nu este prezentat ca barem oficial ANRE.","detail":{"why":"La legarea în paralel, capacitățile se adună: Ce = C1 + C2 + C3 = 100 + 50 + 100 = 250 μF.","opts":{"A":"Greșit: nu se folosesc relațiile de serie pentru această conexiune.","B":"Corect: 100 + 50 + 100 = 250 μF.","C":"Greșit: 50 μF nu reprezintă suma capacităților."},"remember":"Condensatoare în paralel → C echivalentă = ΣC"}},{"ID":"G1-ELE-005","Categorie":"Electrotehnică","Sursa":"ELECTROTEHNICA-09.2024-2.xlsx","Versiune":"09.2024","Rand_sursa":12,"Intrebare":"A doua teoremă a lui Kirchhoff, pentru o reţea electrică cu N noduri şi L laturi (L diferit de N), ne furnizează, pentru analiza unui circuit electric:","A":"L+N-1 ecuaţii distincte","B":"L-N +1 ecuaţii distincte","C":"N-L+1 ecuaţii distincte","Raspuns":"B","Status":"VERIFICAT TEHNIC","Baza_verificare":"Calcul/principiu electrotehnic + coroborare web","Explicatie":"Răspuns verificat tehnic; nu este prezentat ca barem oficial ANRE.","detail":{"why":"Numărul independent de ecuații de ochi este L − N + 1 pentru o rețea conexă.","opts":{"A":"Greșit: L + N − 1 nu este relația pentru numărul de ecuații independente de ochi.","B":"Corect: L − N + 1.","C":"Greșit: N − L + 1 este semnul invers al relației corecte."},"remember":"Ecuații independente de ochi → L − N + 1"}},{"ID":"G1-ELE-006","Categorie":"Electrotehnică","Sursa":"ELECTROTEHNICA-09.2024-2.xlsx","Versiune":"09.2024","Rand_sursa":13,"Intrebare":"AAR se utilizează în scopul:","A":"limitării curenţilor de scurtcircuit;","B":"creşterii continuităţii în alimentare;","C":"reducerii pierderilor de energie pe linii.","Raspuns":"B","Status":"VERIFICAT TEHNIC","Baza_verificare":"Calcul/principiu electrotehnic + coroborare web","Explicatie":"Răspuns verificat tehnic; nu este prezentat ca barem oficial ANRE.","detail":{"why":"AAR (anclanșarea automată a rezervei) reface alimentarea prin conectarea automată a unei surse/rezerve după dispariția alimentării principale.","opts":{"A":"Greșit: limitarea curentului de scurtcircuit este realizată prin alte mijloace de protecție.","B":"Corect: scopul este creșterea continuității alimentării.","C":"Greșit: reducerea pierderilor nu este scopul principal al AAR."},"remember":"AAR → alimentare de rezervă → continuitate ↑"}},{"ID":"G1-ELE-007","Categorie":"Electrotehnică","Sursa":"ELECTROTEHNICA-09.2024-2.xlsx","Versiune":"09.2024","Rand_sursa":14,"Intrebare":"Alunecarea s a unui motor asincron are valori:","A":"cuprinse între 1 si 0","B":"cuprinse între -1 si 0","C":"de regulă, mai mari decât 1","Raspuns":"A","Status":"VERIFICAT TEHNIC","Baza_verificare":"Calcul/principiu electrotehnic + coroborare web","Explicatie":"Răspuns verificat tehnic; nu este prezentat ca barem oficial ANRE.","detail":{"why":"Pentru funcționarea normală în regim de motor, alunecarea este între 0 și 1: s = (ns − n) / ns.","opts":{"A":"Corect: în regim normal de motor, 0 < s < 1.","B":"Greșit: valori negative corespund altui regim de funcționare, nu motorului asincron normal.","C":"Greșit: o alunecare mai mare decât 1 nu descrie regimul normal de motor."},"remember":"Motor asincron normal → 0 < s < 1"}},{"ID":"G1-ELE-009","Categorie":"Electrotehnică","Sursa":"ELECTROTEHNICA-09.2024-2.xlsx","Versiune":"09.2024","Rand_sursa":16,"Intrebare":"Care element nu se foloseşte la reglarea tensiunii în reţelele electrice:","A":"bobina de compensare","B":"transformatorul","C":"rezistorul","Raspuns":"C","Status":"VERIFICAT TEHNIC","Baza_verificare":"Calcul/principiu electrotehnic + coroborare web","Explicatie":"Răspuns verificat tehnic; nu este prezentat ca barem oficial ANRE.","detail":{"why":"În contextul întrebării, rezistorul nu este elementul uzual indicat pentru reglarea tensiunii rețelei; reglarea se face prin mijloace dedicate.","opts":{"A":"Greșit: nu este răspunsul verificat pentru contextul întrebării.","B":"Greșit: nu este răspunsul verificat pentru contextul întrebării.","C":"Corect: este varianta verificată tehnic în baza auditată."},"remember":"Reglarea tensiunii în rețea → mijloace dedicate, nu rezistor de reglaj uzual"}},{"ID":"G1-ELE-010","Categorie":"Electrotehnică","Sursa":"ELECTROTEHNICA-09.2024-2.xlsx","Versiune":"09.2024","Rand_sursa":17,"Intrebare":"Cele mai des utilizate pentru serviciile interne ale centralelor electrice sunt:","A":"motoarele de curent continuu","B":"motoarele sincrone","C":"motoarele asincrone","Raspuns":"C","Status":"VERIFICAT TEHNIC","Baza_verificare":"Calcul/principiu electrotehnic + coroborare web","Explicatie":"Răspuns verificat tehnic; nu este prezentat ca barem oficial ANRE.","detail":{"why":"Motoarele asincrone sunt utilizate pe scară largă pentru acționări și servicii auxiliare datorită construcției robuste și exploatării simple.","opts":{"A":"Greșit: ":null},{"ID":"G1-NOR-100","Categorie":"Norme tehnice","Sursa":"NORME-TEHNICE-Gr.-1-05.2023 (1).xlsx","Versiune":"05.2023","Rand_sursa":107,"Intrebare":"Rezistenţa de izolaţie a pardoselii şi pereţilor în fiecare punct de măsurare în condiţiile specificate în SR EN 61140 şi verificate printr-o metoda recomandată în Anexa 8.1 din I7/2011, dacă tensiunea nominală a instalaţiei nu depăşeşte 500 V în tensiune continuă sau alternativă, trebuie să fie mai mare de","A":"75 kΩ","B":"50 kΩ","C":"100 kΩ","Raspuns":"B","Status":"VERIFICAT TEHNIC","Baza_verificare":"I7-2011 + verificare tehnică","Explicatie":"Răspuns dedus/verificat pe formularea I7-2011; întrebările cu definiții sau valori disputabile rămân în revizuire.","detail":null}]; const EXCLUDED=["G1-ELE-008", "G1-ELE-023", "G1-ELE-024", "G1-ELE-025", "G1-ELE-032", "G1-ELE-036", "G1-ELE-037", "G1-ELE-058", "G1-ELE-110", "G1-ELE-169", "G1-ELE-174"]; const KEY='anre_g1_final_v1';
const cats=['Toate',...new Set(DATA.map(x=>x.Categorie))];
let state=load(); let timerId=null;
function fresh(){return {mode:'home',filter:'Toate',index:0,seen:{},attempts:{},mistakes:{},quick:null,exam:null,examResult:null}}
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));return x?{...fresh(),...x}:fresh()}catch(e){return fresh()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}}
function setMode(m){stopTimer();state.mode=m;state.index=0;if(m==='quick')state.quick=null;if(m!=='exam')state.examResult=null;save();render()}
function pool(){let p=DATA.filter(q=>state.filter==='Toate'||q.Categorie===state.filter); if(state.mode==='mistakes') p=p.filter(q=>state.mistakes[q.ID]); return p}
function counts(){let attempts=Object.values(state.attempts);return {seen:Object.keys(state.seen).length,attempts:attempts.reduce((a,x)=>a+(x.count||0),0),correct:attempts.reduce((a,x)=>a+(x.correct||0),0),wrong:attempts.reduce((a,x)=>a+(x.wrong||0),0)}}
function accuracy(){let c=counts();return c.attempts?Math.round(c.correct/c.attempts*100):0}
function render(){document.getElementById('count').textContent=`${DATA.length} întrebări`;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.mode===state.mode));let a=document.getElementById('app');if(state.mode==='home')renderHome(a);else if(state.mode==='learn')renderLearn(a,false);else if(state.mode==='mistakes')renderMistakes(a);else if(state.mode==='quick')renderQuick(a);else if(state.mode==='exam')state.exam?renderExam(a):state.examResult?renderExamResult(a):renderExamSetup(a);else if(state.mode==='stats')renderStats(a)}
function renderHome(a){let c=counts();a.innerHTML=`<section class="card hero"><div class="pill">⚡ PREGĂTIRE ANRE GRAD I</div><h1>Învață. Exersează. Simulează.</h1><p>Un trainer local pentru cele 414 întrebări utilizabile din baza auditată. Alege un mod și începe direct.</p><div class="grid"><button class="mode" onclick="setMode('learn')"><div class="icon">📚</div><b>Învățare</b><span>Răspuns imediat, explicații și analiză a variantelor.</span></button><button class="mode" onclick="setMode('mistakes')"><div class="icon">🔥</div><b>Greșelile mele</b><span>Repetă întrebările la care ai probleme și urmărește progresul.</span></button><button class="mode" onclick="setMode('quick')"><div class="icon">⚡</div><b>Test rapid</b><span>10 întrebări pentru o sesiune scurtă.</span></button><button class="mode" onclick="setMode('exam')"><div class="icon">📝</div><b>Simulare examen</b><span>20, 30, 50 sau 100 de întrebări, cu cronometru.</span></button></div><div class="home-stats"><div class="stat"><span>Văzute</span><b>${c.seen}/${DATA.length}</b></div><div class="stat"><span>Încercări</span><b>${c.attempts}</b></div><div class="stat"><span>Acuratețe</span><b>${accuracy()}%</b></div></div><div class="home-note"><b>Notă de metodă:</b> aplicația nu prezintă răspunsurile ca „barem oficial ANRE”. Ele provin din baza de întrebări auditată pentru proiect și au status de verificare documentat.</div></section>`}
function renderLearn(a,isQuick){let p=pool();if(!p.length){a.innerHTML=`<section class="card center"><h2>🔥 Nu ai greșeli salvate</h2><p class="small">În acest moment nu există întrebări de repetat în modul selectat.</p><button class="btn primary" onclick="setMode('learn')">📚 Învățare</button></section>`;return}let idx=state.index%p.length;renderQuestion(a,p[idx],idx,p.length,isQuick)}
function renderMistakes(a){let ids=DATA.filter(q=>state.mistakes[q.ID]).sort((x,y)=>(state.mistakes[y.ID]||0)-(state.mistakes[x.ID]||0));if(!ids.length){a.innerHTML=`<section class="card center"><h2>🔥 Lista este goală</h2><p class="small">Pe măsură ce greșești întrebări, ele apar aici. După ce le stăpânești, dispar din lista activă.</p><button class="btn primary" onclick="setMode('learn')">Începe învățarea</button></section>`;return}a.innerHTML=`<section class="card"><div class="section-title"><div><h2>🔥 Greșelile mele</h2><div class="small">${ids.length} întrebări active · sortate după numărul de greșeli</div></div><span class="pill">${ids.reduce((s,q)=>s+(state.mistakes[q.ID]||0),0)} greșeli</span></div><div style="margin-top:12px">${ids.slice(0,25).map(q=>`<div class="row"><div style="flex:1"><b>${esc(q.ID)}</b><div class="small">${esc(q.Intrebare)}</div></div><b>${state.mistakes[q.ID]}×</b></div>`).join('')}</div><div class="actions"><button class="btn primary" onclick="setMode('mistakes')">▶ Repetă greșelile</button><button class="btn ghost" onclick="setMode('learn')">📚 Învățare</button></div></section>`}
function renderQuestion(a,q,idx,total,isQuick){a.innerHTML=`<div class="stats"><div class="stat"><span>Corecte</span><b>${counts().correct}</b></div><div class="stat"><span>Greșite</span><b>${counts().wrong}</b></div><div class="stat"><span>Acuratețe</span><b>${accuracy()}%</b></div><div class="stat"><span>Materie</span><b style="font-size:13px">${esc(q.Categorie)}</b></div></div><section class="card"><div class="meta"><span class="pill">${esc(q.ID)}</span><span class="pill">${esc(q.Versiune)}</span><span class="pill">${esc(q.Status)}</span>${!isQuick?`<select id="filter">${cats.map(c=>`<option ${c===state.filter?'selected':''}>${esc(c)}</option>`).join('')}</select>`:''}</div><div class="progress"><div class="bar" style="width:${((idx+1)/total)*100}%"></div></div><div class="small">Întrebarea ${idx+1} / ${total}</div><div class="q">${esc(q.Intrebare)}</div><div class="answers">${['A','B','C'].map(k=>`<button class="answer" data-answer="${k}"><b>${k}.</b> ${esc(q[k])}</button>`).join('')}</div><div id="feedback"></div><div class="source"><b>Sursă:</b> ${esc(q.Sursa)} · rând ${esc(q.Rand_sursa)} · ${esc(q.Baza_verificare)}</div><div class="actions"><button class="btn ghost" id="prev">← Anterioară</button><button class="btn primary hidden" id="next">Următoarea →</button></div></section>`;if(!isQuick)document.getElementById('filter').onchange=e=>{state.filter=e.target.value;state.index=0;save();render()};document.getElementById('prev').onclick=()=>{if(isQuick)state.quick.pos=(state.quick.pos-1+total)%total;else state.index=(state.index-1+total)%total;save();render()};document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>answer(q,b.dataset.answer,isQuick));}
function explain(q){if(q.detail)return `<b>${esc(q.detail.why)}</b><div class="analysis"><b>Analiza variantelor</b>${['A','B','C'].map(k=>`<div class="option-note ${k===q.Raspuns?'ok':''}"><b>${k===q.Raspuns?'✅':'❌'} ${k}.</b> ${esc(q[k])}<br><span>${esc(q.detail.opts[k])}</span></div>`).join('')}</div><div class="remember">🧠 <b>De reținut:</b> ${esc(q.detail.remember)}</div>`;return `<b>${esc(q.Explicatie||'Răspuns verificat tehnic în baza auditată.')}</b><div class="analysis"><b>Analiza variantelor</b><div class="option-note ok"><b>✅ ${esc(q.Raspuns)}.</b> Varianta marcată este răspunsul verificat în baza auditată.</div>${['A','B','C'].filter(k=>k!==q.Raspuns).map(k=>`<div class="option-note limited"><b>❌ ${k}.</b> ${esc(q[k])}<br><span>Nu este varianta verificată pentru această întrebare. Baza auditată nu conține o justificare individuală pentru această opțiune, așa că aplicația nu inventează o explicație.</span></div>`).join('')}</div>`}
function answer(q,choice,isQuick){if(document.querySelector('.answer:disabled'))return;let ok=choice===q.Raspuns;state.seen[q.ID]=1;let a=state.attempts[q.ID]||{count:0,correct:0,wrong:0,last:null,lastAt:0};a.count++;a.last=ok?'correct':'wrong';a.lastAt=Date.now();if(ok)a.correct++;else a.wrong++;state.attempts[q.ID]=a;if(ok)delete state.mistakes[q.ID];else state.mistakes[q.ID]=(state.mistakes[q.ID]||0)+1;if(isQuick){state.quick.answers[q.ID]=choice;if(ok)state.quick.correct++}save();document.querySelectorAll('.answer').forEach(b=>{b.disabled=true;if(b.dataset.answer===q.Raspuns)b.classList.add('correct');if(b.dataset.answer===choice&&!ok)b.classList.add('wrong')});let fb=document.getElementById('feedback');fb.innerHTML=`<div class="feedback ${ok?'good':'bad'}"><b>${ok?'👍 Corect!':'👎 Greșit.'}</b> ${ok?'Ai ales '+choice+'.':'Ai ales '+choice+'. Răspunsul verificat este '+q.Raspuns+'.'}<div class="explain">${explain(q)}</div></div>`;document.getElementById('next').classList.remove('hidden');document.getElementById('next').onclick=()=>{state.index++;if(isQuick)state.quick.pos++;save();if(isQuick&&state.quick.pos>=10){renderQuickResult(document.getElementById('app'));}else render()}}
function startQuick(){let ids=shuffle(DATA).slice(0,10);state.quick={ids:ids.map(x=>x.ID),pos:0,answers:{},correct:0};state.mode='quick';state.index=0;save();render()}
function renderQuick(a){if(!state.quick){a.innerHTML=`<section class="card center"><h2>⚡ Test rapid</h2><p class="small">10 întrebări aleatorii. Feedback imediat.</p><button class="btn primary" onclick="startQuick()">▶ Începe testul</button></section>`;return}if(state.quick.pos>=10){renderQuickResult(a);return}let q=DATA.find(x=>x.ID===state.quick.ids[state.quick.pos]);renderQuestion(a,q,state.quick.pos,10,true)}
function renderQuickResult(a){let q=state.quick;a.innerHTML=`<section class="card center"><h2>🏁 Test rapid finalizat</h2><div class="result"><div class="stat"><span>Scor</span><b>${q.correct}/10</b></div><div class="stat"><span>Procent</span><b>${q.correct*10}%</b></div><div class="stat"><span>Întrebări</span><b>10</b></div><div class="stat"><span>Greșeli active</span><b>${Object.keys(state.mistakes).length}</b></div></div><div class="actions"><button class="btn primary" onclick="state.quick=null;save();startQuick()">⚡ Alt test</button><button class="btn" onclick="setMode('mistakes')">🔥 Greșelile mele</button><button class="btn ghost" onclick="setMode('learn')">📚 Învățare</button></div></section>`}
function shuffle(arr){return [...arr].sort(()=>Math.random()-.5)}
function renderExamSetup(a){stopTimer();a.innerHTML=`<section class="card"><h2>📝 Simulare examen</h2><p class="small">Alege numărul de întrebări și materia. În timpul simulării nu primești explicații. La final vezi scorul și corectarea.</p><div class="grid"><button class="mode" onclick="startExam(20,20)"><div class="icon">🎯</div><b>20 întrebări</b><span>20 minute · simulare scurtă</span></button><button class="mode" onclick="startExam(30,30)"><div class="icon">📘</div><b>30 întrebări</b><span>30 minute · sesiune standard</span></button><button class="mode" onclick="startExam(50,50)"><div class="icon">🧪</div><b>50 întrebări</b><span>50 minute · simulare extinsă</span></button><button class="mode" onclick="startExam(100,100)"><div class="icon">🏋️</div><b>100 întrebări</b><span>100 minute · maraton</span></button></div><div class="notice" style="margin-top:15px">⚠️ Scorul este pentru antrenament. Aplicația nu declară un prag oficial de promovare și nu înlocuiește condițiile examenului ANRE.</div></section>`}
function startExam(n,mins){let ids=shuffle(DATA).slice(0,Math.min(n,DATA.length)).map(x=>x.ID);state.exam={ids,pos:0,answers:{},seconds:mins*60,startedAt:Date.now()};state.examResult=null;save();render();timerId=setInterval(()=>{if(!state.exam){stopTimer();return}state.exam.seconds--;save();updateTimer();if(state.exam.seconds<=0)finishExam()},1000)}
function updateTimer(){let el=document.getElementById('timer');if(!el||!state.exam)return;let s=Math.max(0,state.exam.seconds),m=Math.floor(s/60),sec=s%60;el.textContent=String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');el.classList.toggle('warn',s<=60)}
function renderExam(a){let e=state.exam;if(e.pos>=e.ids.length){finishExam();return}let q=DATA.find(x=>x.ID===e.ids[e.pos]);a.innerHTML=`<section class="card"><div class="exam-head"><div><span class="pill">SIMULARE · ${e.ids.length} întrebări</span><div class="small" style="margin-top:7px">${e.pos+1} / ${e.ids.length}</div></div><div class="timer" id="timer">--:--</div></div><div class="progress"><div class="bar" style="width:${((e.pos+1)/e.ids.length)*100}%"></div></div><div class="q">${esc(q.Intrebare)}</div><div class="answers">${['A','B','C'].map(k=>`<button class="answer ${e.answers[q.ID]===k?'selected':''}" data-answer="${k}"><b>${k}.</b> ${esc(q[k])}</button>`).join('')}</div><div class="small" style="margin-top:11px">Poți reveni la întrebările anterioare și schimba răspunsul. Nu există feedback până la final.</div><div class="actions"><button class="btn ghost" onclick="examBack()">← Anterioară</button><button class="btn danger" onclick="finishExam()">Încheie</button><button class="btn primary" onclick="examNext()">${e.pos===e.ids.length-1?'Finalizează':'Următoarea →'}</button></div></section>`;updateTimer();document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>{e.answers[q.ID]=b.dataset.answer;save();document.querySelectorAll('.answer').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')})}
function examNext(){if(state.exam.pos<state.exam.ids.length-1)state.exam.pos++;else{finishExam();return}save();render()}function examBack(){if(state.exam.pos>0)state.exam.pos--;save();render()}
function finishExam(){if(!state.exam)return;stopTimer();let e=state.exam,answered=0,correct=0,wrong=[],unanswered=[];e.ids.forEach(id=>{let q=DATA.find(x=>x.ID===id),ch=e.answers[id];if(!ch)unanswered.push(q);else{answered++;let ok=ch===q.Raspuns;if(ok)correct++;else wrong.push({q,a:ch});let at=state.attempts[id]||{count:0,correct:0,wrong:0,last:null,lastAt:0};at.count++;at.last=ok?'correct':'wrong';at.lastAt=Date.now();if(ok)at.correct++;else at.wrong++;state.attempts[id]=at;state.seen[id]=1;if(ok)delete state.mistakes[id];else state.mistakes[id]=(state.mistakes[id]||0)+1}});state.examResult={total:e.ids.length,answered,correct,wrong,unanswered,finishedAt:Date.now()};state.exam=null;save();render()}
function renderExamResult(a){let r=state.examResult||{total:0,answered:0,correct:0,wrong:[],unanswered:[]};a.innerHTML=`<section class="card"><h2>🏁 Rezultatul simulării</h2><div class="result"><div class="stat"><span>Scor</span><b>${r.correct}/${r.total}</b></div><div class="stat"><span>Procent</span><b>${Math.round(r.correct/r.total*100)||0}%</b></div><div class="stat"><span>Răspunse</span><b>${r.answered}/${r.total}</b></div><div class="stat"><span>Nerezolvate</span><b>${r.unanswered.length}</b></div></div><div class="notice">Rezultatul este un indicator de antrenament. Nu este un barem oficial și nu stabilește promovarea examenului real.</div><div class="actions"><button class="btn primary" onclick="state.examResult=null;save();renderExamSetup(document.getElementById('app'))">📝 Alt examen</button><button class="btn" onclick="setMode('mistakes')">🔥 Vezi greșelile</button></div>${r.wrong.length?'<h3>❌ Corectare</h3>'+r.wrong.map(x=>`<div class="review-item"><h4>${esc(x.q.Intrebare)}</h4><div class="small">Ai ales: <b>${esc(x.a)}</b> · Corect: <b>${esc(x.q.Raspuns)}</b></div><div class="explain">${explain(x.q)}</div></div>`).join(''):''}${r.unanswered.length?'<h3>⚪ Nerezolvate</h3>'+r.unanswered.map(q=>`<div class="review-item"><h4>${esc(q.Intrebare)}</h4><div class="small">Răspuns corect: <b>${esc(q.Raspuns)}</b></div></div>`).join(''):''}</section>`}
function renderStats(a){let c=counts();let cs=cats.slice(1);a.innerHTML=`<section class="card"><div class="section-title"><div><h2>📊 Statistici</h2><div class="small">Istoricul se păstrează local în browser.</div></div><span class="pill">${accuracy()}% acuratețe</span></div><div class="stats" style="margin-top:15px"><div class="stat"><span>Văzute</span><b>${c.seen}</b></div><div class="stat"><span>Încercări</span><b>${c.attempts}</b></div><div class="stat"><span>Corecte</span><b>${c.correct}</b></div><div class="stat"><span>Greșite</span><b>${c.wrong}</b></div></div>${cs.map(cat=>{let d=DATA.filter(x=>x.Categorie===cat),seen=d.filter(x=>state.seen[x.ID]).length,at=d.reduce((s,q)=>s+(state.attempts[q.ID]?.count||0),0),co=d.reduce((s,q)=>s+(state.attempts[q.ID]?.correct||0),0),wr=d.reduce((s,q)=>s+(state.attempts[q.ID]?.wrong||0),0),acc=at?Math.round(co/at*100):0;return `<div class="row"><div style="flex:1"><b>${esc(cat)}</b><div class="small">${seen}/${d.length} văzute · ${at} încercări · ${co} corecte · ${wr} greșite · ${acc}%</div><div class="bar2"><i style="width:${seen/d.length*100}%"></i></div></div><b>${acc}%</b></div>`}).join('')}<h3 style="margin-top:18px">🔥 Întrebările care cer cea mai multă consolidare</h3>${DATA.filter(q=>state.attempts[q.ID]?.wrong).sort((a,b)=>(state.attempts[b.ID]?.wrong||0)-(state.attempts[a.ID]?.wrong||0)).slice(0,8).map(q=>`<div class="row"><div style="flex:1"><b>${esc(q.ID)}</b><div class="small">${esc(q.Intrebare)}</div></div><b>${state.attempts[q.ID].wrong}×</b></div>`).join('')||'<div class="small">Încă nu există suficiente date. Rezolvă câteva întrebări.</div>'}<div class="actions"><button class="btn primary" onclick="setMode('learn')">📚 Continuă</button><button class="btn danger" onclick="resetProgress()">Resetare progres</button></div></section>`}
function resetProgress(){if(confirm('Ștergi progresul local, istoricul, greșelile și rezultatele salvate?')){stopTimer();state=fresh();save();render()}}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{if(b.dataset.mode==='exam'){state.mode='exam';state.examResult=null;save();render()}else setMode(b.dataset.mode)});render();
</script></body></html>
